{% extends "base.html" %}

{% block title %}Simple Login - Secure Data Sharing System{% endblock %}

{% block head %}
<style>
    .card {
        background: white;
        border: 1px solid #e3e6f0;
        border-radius: 8px;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        transition: all 0.3s ease;
    }
    .card:hover {
        box-shadow: 0 0.25rem 2rem 0 rgba(58, 59, 69, 0.2);
    }
    .btn-primary {
        background-color: #4e73df;
        border-color: #4e73df;
        color: white;
        border-radius: 6px;
        font-weight: 500;
        transition: all 0.3s ease;
    }
    .btn-primary:hover {
        background-color: #2e59d9;
        border-color: #2653d4;
        transform: translateY(-1px);
    }
    .form-control {
        border: 1px solid #d1d3e2;
        border-radius: 6px;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        transition: border-color 0.15s ease-in-out;
    }
    .form-control:focus {
        border-color: #4e73df;
        box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-shield-alt fa-3x text-primary mb-3"></i>
                    <h2 class="fw-bold">Quick Access</h2>
                    <p class="text-muted">Enter any username to continue</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label for="user_id" class="form-label">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" class="form-control" id="user_id" name="user_id" 
                               placeholder="Enter any username" value="user">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="fas fa-sign-in-alt"></i> Continue
                    </button>
                </form>

                <div class="mt-4">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        <strong>No password required!</strong><br>
                        Just enter any username and click Continue to access the system.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
